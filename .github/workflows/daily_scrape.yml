name: Daily HR Job Scraper

# Bot akan jalan berdasarkan schedule Cron
on:
  schedule:
    # 00:00 UTC = Jam 07:00 Pagi waktu WIB
    # 10:00 UTC = Jam 17:00 Pagi waktu WIB
    - cron: '0 0,10 * * *'
    
  # Memberikan tombol manual untuk tes jika ingin coba run klik dari Github Web UI!
  workflow_dispatch: 

jobs:
  scrape_and_notify:
    runs-on: ubuntu-latest

    # Permission write ini wajib ditambahkan supaya Bot Github 
    # bisa melakukan Git Commit file JSON jika ada lowongan baru 
    permissions:
      contents: write

    steps:
      # Step 1: Tarik source code dari repositori ke server Github Actions
      - name: Checkout repository
        uses: actions/checkout@v4

      # Step 2: Setel Python version yang kita butuhkan
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.10"
          cache: "pip"

      # Step 3: Pemasangan Library requests dan bs4
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      # Step 4: Menjalankan file Python dengan membawa value rahasia (Secrets)
      - name: Run Scraper Script
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: |
          python main.py

      # Step 5: Save (Commit) database history kembali ke Repositori
      - name: Commit and Push Database JSON
        run: |
          git config --local user.email "github-actions[bot]@users.noreply.github.com"
          git config --local user.name "github-actions[bot]"
          
          # Force add jikalau file processed_jobs.json tertimpa oleh baru
          git add processed_jobs.json
          
          # Pastikan commit dijalankan 'jika ada file yang berubah saja', lalu push kembali ke Github
          git diff --quiet && git diff --staged --quiet || (git commit -m "chore: update processed jobs database" && git push)
